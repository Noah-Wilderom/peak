name: Release

# Builds, signs and checks every platform's artifacts. A tag also makes a *draft* GitHub release.
# Drafts aren't visible at releases/latest, which is the update channel, so nothing here can
# reach users. Publishing the draft is a separate, deliberate act (docs/RELEASING.md).
on:
  push:
    tags: ["v*.*.*"]
    branches: ["release-validation/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner: an AppImage only runs on glibc this new or newer.
          - { os: ubuntu-22.04, platform: linux, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, platform: windows, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, platform: darwin-aarch64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: darwin-x86_64, target: x86_64-apple-darwin }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      # Only when configured: an empty value would make the bundler try to import nothing.
      # Without them macOS is ad-hoc signed; see docs/RELEASING.md.
      - name: Apple trust, if configured
        if: startsWith(matrix.platform, 'darwin')
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APASS: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            { echo "APPLE_CERTIFICATE=$CERT"; echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"; echo "APPLE_SIGNING_IDENTITY=$IDENTITY"; } >> "$GITHUB_ENV"
          fi
          if [ -n "$AID" ]; then
            { echo "APPLE_ID=$AID"; echo "APPLE_PASSWORD=$APASS"; echo "APPLE_TEAM_ID=$TEAM"; } >> "$GITHUB_ENV"
          fi
      - name: Check the tag matches the version
        shell: bash
        run: node scripts/release/version.mjs check ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Linux system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential xvfb libfuse2
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: scripts/release/build-linux.sh artifacts
      - name: Build
        if: matrix.platform != 'linux'
        shell: bash
        env:
          PEAK_REQUIRE_COLLECTOR: "1"
        run: |
          bun install --frozen-lockfile
          sh scripts/release/tauri-build.sh --target ${{ matrix.target }}
          node scripts/release/collect.mjs src-tauri/target/${{ matrix.target }}/release/bundle artifacts ${{ matrix.platform }}
      - name: Check the signatures, independently of Tauri
        shell: bash
        run: |
          PUB=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          checked=0
          for sig in artifacts/*.sig; do
            node scripts/release/verify-signature.mjs "${sig%.sig}" "$sig" "$PUB" | grep '^signature ok'
            checked=$((checked + 1))
          done
          [ "$checked" -gt 0 ]
      - uses: ./.github/actions/runtimes
      - name: A screen capture tool for Linux
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y --no-install-recommends imagemagick
      - name: Smoke test the packaged app
        shell: bash
        env:
          PEAK_SMOKE_PLATFORM: ${{ matrix.platform }}
          PEAK_SMOKE_REQUIRE: node,python,bun,php,go${{ matrix.platform != 'windows' && ',php-excimer' || '' }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "$PEAK_SMOKE_PLATFORM" = linux ]; then xvfb-run -a -s "-screen 0 1440x950x24" node scripts/e2e/smoke/smoke.mjs artifacts smoke-output
          else node scripts/e2e/smoke/smoke.mjs artifacts smoke-output; fi
      - name: What drives the window on Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver
          cargo install tauri-driver --locked
      - name: What reads the screen on macOS, if its accessibility tree can't
        if: startsWith(matrix.platform, 'darwin')
        run: brew install tesseract cliclick
      - name: The agents in the installed window
        if: always()
        shell: bash
        env:
          PEAK_SMOKE_PLATFORM: ${{ matrix.platform }}
        run: |
          export PEAK_TAURI_DRIVER="$HOME/.cargo/bin/tauri-driver"
          if [ "$PEAK_SMOKE_PLATFORM" = linux ]; then
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a -s "-screen 0 1440x950x24" node scripts/e2e/desktop/agents-ui.mjs artifacts smoke-output/window
          else
            node scripts/e2e/desktop/agents-ui.mjs artifacts smoke-output/window
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke-output
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Draft release
    # Only a tag gets here. Never marks a release as published.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: all
          merge-multiple: true
      - name: Write the feed and checksums
        run: |
          cp scripts/install-release.sh all/install.sh
          node scripts/release/manifest.mjs all ${{ github.ref_name }} docs/release-notes/${{ github.ref_name }}.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} all/* --draft --verify-tag --title "Peak ${{ github.ref_name }}" --notes-file docs/release-notes/${{ github.ref_name }}.md
