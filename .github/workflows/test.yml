name: Tests

on:
  push:
    branches: [master, "release-validation/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/release/version.mjs check
      - run: node scripts/release/collect-check.mjs
      - run: bun run typecheck
      # Coverage thresholds (100%) are enforced in vitest.config.ts.
      - run: bun run test:coverage
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/lcov.info

  backend:
    name: Backend (fmt, clippy, tests, coverage)
    runs-on: ubuntu-latest
    env:
      PEAK_REQUIRE_COLLECTOR: "1"
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # A real PHP with its report at exit. Excimer is covered in the agents job and on each OS.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none
      # tauri::generate_context! embeds the built frontend, so build it first.
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: .
        run: bun install --frozen-lockfile && bun run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The collector must build on its own, without the desktop's system libraries.
      - run: cargo build -p peak-collector
      # Core modules are covered by tests; lib.rs/main.rs are thin glue. The live_*
      # files are test harnesses for real infrastructure (see docs/REMOTE-VALIDATION.md).
      - run: cargo llvm-cov --workspace --ignore-filename-regex '(lib|main|peak-cli|live_\w+)\.rs$' --fail-under-lines 99 --lcov --output-path lcov.info
      # Even when the gate fails, say by how much.
      - if: always()
        run: cargo llvm-cov --workspace --no-run --ignore-filename-regex '(lib|main|peak-cli|live_\w+)\.rs$' --summary-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: src-tauri/lcov.info

  agents:
    name: Runtime agents (Node ${{ matrix.node }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Bun said to work, and the newest.
          - { node: "20", php: "8.1", extensions: excimer, bun: "1.2.15" }
          - { node: "22", php: "8.3", extensions: excimer, bun: latest }
          - { node: "22", php: "8.4", extensions: "", bun: latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          coverage: none
          tools: none
      - run: node --test src-tauri/agents/tests/*.test.mjs
        env:
          PEAK_TEST_BUN_VERSION: ${{ matrix.bun != 'latest' && matrix.bun || '' }}
      - run: python -m unittest discover -s src-tauri/agents/tests -v

  go-sdk:
    name: Go SDK and examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest the module says it supports, and the newest.
        go: ["1.21", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - if: matrix.go == 'stable'
        working-directory: examples
        run: |
          go vet ./...
          go build ./...
