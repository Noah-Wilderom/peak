name: Update proof

# Proves a real update on each OS without touching the release channel or its signing key:
# builds two versions with a throwaway key, serves them from localhost, and upgrades.
on:
  push:
    branches: ["release-validation/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Upgrade (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, platform: windows, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, platform: darwin-aarch64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: darwin-x86_64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: proof-${{ matrix.target }}
      - name: Linux system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential xvfb libfuse2
      - run: bun install --frozen-lockfile
      - name: Build, serve and upgrade
        shell: bash
        env:
          PEAK_SMOKE_PLATFORM: ${{ matrix.platform }}
          PEAK_PROOF_TARGET: ${{ matrix.target }}
        run: |
          if [ "$PEAK_SMOKE_PLATFORM" = linux ]; then xvfb-run -a node scripts/e2e/smoke/update-proof.mjs proof-output
          else node scripts/e2e/smoke/update-proof.mjs proof-output; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-proof-${{ matrix.platform }}
          path: proof-output
          if-no-files-found: warn

  ui:
    name: Upgrade through the real buttons (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, platform: windows, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ui-${{ matrix.target }}
      - name: Linux system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential xvfb libfuse2 webkit2gtk-driver
      - run: bun install --frozen-lockfile
      - name: WebDriver bridge
        if: matrix.platform == 'linux'
        run: cargo install tauri-driver --locked
      - name: Drive the update
        shell: bash
        env:
          PEAK_SMOKE_PLATFORM: ${{ matrix.platform }}
          PEAK_PROOF_TARGET: ${{ matrix.target }}
        run: |
          export PEAK_TAURI_DRIVER="$HOME/.cargo/bin/tauri-driver"
          if [ "$PEAK_SMOKE_PLATFORM" = linux ]; then
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a -s "-screen 0 1440x950x24" node scripts/e2e/desktop/update-ui.mjs ui-output
          else
            node scripts/e2e/desktop/update-ui.mjs ui-output
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-ui-${{ matrix.platform }}
          path: ui-output
          if-no-files-found: warn

  platform-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build frontend
        working-directory: .
        run: bun install --frozen-lockfile && bun run build
      - run: cargo test --workspace --no-fail-fast
        env:
          PEAK_REQUIRE_COLLECTOR: "1"

  # Before a release can update from it, shows the published previous release's own buttons can be
  # pressed from outside on each OS, so the real run in public-delivery.yml doesn't find out first.
  upgrade-rehearsal:
    name: Rehearse the release-to-release update (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux }
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: darwin-aarch64 }
          - { os: macos-15-intel, platform: darwin-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: A desktop's libraries, and what reads and presses its screen
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 xvfb libegl1 libgl1 libx11-xcb1 libx11-6 libdrm2 libexpat1 libfontconfig1 libfreetype6 libfribidi0 libgbm1 libharfbuzz0b libwayland-client0 libxcb1 imagemagick xdotool tesseract-ocr tesseract-ocr-eng
      - name: What reads and presses the screen on macOS, if its accessibility tree can't
        if: startsWith(matrix.platform, 'darwin')
        run: brew install tesseract cliclick
      - name: Install the published release, and press its buttons
        shell: bash
        env:
          PEAK_SMOKE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PEAK_SMOKE_PLATFORM" = linux ]; then xvfb-run -a -s "-screen 0 1440x950x24" node scripts/e2e/smoke/release-upgrade.mjs v0.1.0 v0.1.1 rehearsal --rehearse
          else node scripts/e2e/smoke/release-upgrade.mjs v0.1.0 v0.1.1 rehearsal --rehearse; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-rehearsal-${{ matrix.platform }}
          path: rehearsal
          if-no-files-found: warn
