version: '3'

includes:
  examples:
    taskfile: ./examples/Taskfile.yml
    dir: ./examples

tasks:
  default:
    cmds:
      - task --list

  dev:
    desc: Start the Peak desktop app in development mode
    cmds:
      - bun install --frozen-lockfile
      - bun run tauri dev

  peak:build:
    desc: Build the optimized Peak app and CLI at src-tauri/target/release/peak (doesn't change PATH)
    cmds:
      - bun install --frozen-lockfile
      - bun run tauri build --no-bundle
      - cmd: |
          echo
          echo "Built src-tauri/target/release/peak. It isn't on your PATH, so bare 'peak' won't work yet."
          echo "  Open the app:     ./src-tauri/target/release/peak"
          echo "  Use the CLI:      ./src-tauri/target/release/peak run -- <command>"
          echo "  Install 'peak':   task peak:install"
        silent: true

  peak:install:
    desc: Build Peak and install the peak command to ~/.local/bin (or PEAK_INSTALL_DIR)
    cmds:
      - task: peak:build
      - sh scripts/install-peak.sh

  test:live:
    desc: Run live remote validation against disposable sshd, containers and k3s
    dir: src-tauri
    cmds:
      - cargo test --test live_ssh --test live_docker --test live_kube -- --ignored --test-threads=1 --nocapture
